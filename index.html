<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- "default" = iOS reserves an opaque status bar and starts the app BELOW it,
     so content can never render under the clock. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Biome" />
<title>Exquisite Biome</title>
<meta property="og:title" content="Exquisite Biome" />
<meta property="og:description" content="A game of speculative biology, by Caro Asercion." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://djessemann.github.io/exquisite-biome-tribute/" />
<meta property="og:image" content="https://djessemann.github.io/exquisite-biome-tribute/icons/share.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://djessemann.github.io/exquisite-biome-tribute/icons/share.png" />
<link rel="manifest" href="manifest.webmanifest" />
<!-- SVG first for crisp tabs at any size; the PNG covers everything that
     can't take an SVG (Safari, apple-touch-icon, the manifest). -->
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="icon" type="image/png" href="icons/icon.png" />
<link rel="apple-touch-icon" href="icons/icon.png" />
<style>
  /* ------------------------------------------------------------------
     Deliberately unstyled: Arial, white background, black 1px boxes.
     This is a wireframe — the only color in the app is the red used for
     hearts/diamonds, which is load-bearing (the "distinctive feature"
     table is selected by card COLOR, not suit), never decorative.
     ------------------------------------------------------------------ */
  :root{
    --col: 560px;
    --gutter: 16px;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
    --chrome-size: 46px;
    font-size:16px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* Lock the document; #root is the single scroll surface. */
  html,body{ margin:0; width:100%; height:100%; height:100dvh; background:#fff; overflow:hidden; position:fixed; }
  body{
    font-family:Arial, Helvetica, sans-serif;
    color:#000; font-size:16px; line-height:1.55;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  #root{ height:100%; height:100dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  textarea, input, .selectable{ -webkit-user-select:text; user-select:text; }
  button{ font-family:inherit; font-size:16px; cursor:pointer; }

  /* ---------- layout ---------- */
  .screen{
    position:relative; min-height:100%;
    display:flex; flex-direction:column;
    padding: calc(var(--safe-top) + 16px) var(--gutter) calc(var(--safe-bottom) + 16px);
    max-width:var(--col); margin:0 auto; width:100%;
  }
  /* reserve a band so nothing sits under the fixed home/help chrome */
  .screen.with-chrome{ padding-bottom: calc(var(--safe-bottom) + var(--chrome-size) + 28px); }
  .center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; }
  .grow{ flex:1; min-height:0; }
  .stack{ display:flex; flex-direction:column; gap:10px; align-items:stretch; }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row.spread{ justify-content:space-between; }
  .row.center-row{ justify-content:center; }

  /* ---------- type ---------- */
  h1{ font-size:25px; font-weight:bold; margin:0; line-height:1.3; }
  h2{ font-size:18px; font-weight:bold; margin:0 0 9px; }
  p{ margin:0 0 10px; }
  p:last-child{ margin-bottom:0; }
  .label{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .meta{ font-size:13.5px; }
  .step{ font-size:13.5px; margin-bottom:10px; }
  ul{ margin:0 0 10px; padding-left:20px; }

  /* ---------- boxes ---------- */
  .box{ border:1px solid #000; padding:12px; margin-bottom:12px; }
  .box:last-child{ margin-bottom:0; }
  .box.tight{ padding:8px 10px; }
  .prompt{ margin-bottom:12px; }
  .prompt:last-child{ margin-bottom:0; }

  /* ---------- buttons ---------- */
  .btn{
    appearance:none; border:1px solid #000; background:#fff; color:#000;
    padding:12px 18px; border-radius:0; text-align:center;
  }
  .btn.primary{ background:#000; color:#fff; }
  .btn:disabled{ opacity:.35; cursor:default; }
  .btn.small{ padding:8px 12px; font-size:13.5px; }
  .btn.block{ width:100%; }
  .btn-stack{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:300px; }

  /* selectable option (scene frame) */
  .option{ display:block; width:100%; text-align:left; border:1px solid #000; background:#fff;
    color:#000; padding:14px; border-radius:0; margin-bottom:10px; line-height:1.45; }
  .option.on{ border-width:3px; padding:12px; }

  /* ---------- cards ----------
     A card is a box with its rank and suit in it. Nothing more. */
  .card{ border:1px solid #000; width:66px; height:92px; flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#fff; color:#000; font-size:17px; line-height:1.15; }
  .card .rk{ font-weight:bold; }
  .card .st{ font-size:21px; }
  .card.red{ color:#c00; }
  .card.lg{ width:86px; height:120px; font-size:22px; }
  .card.lg .st{ font-size:28px; }
  .card.sm{ width:40px; height:56px; font-size:13px; }
  .card.sm .st{ font-size:15px; }
  .card.back{ color:#000; }
  .card.sel{ border-width:3px; }

  /* a card plus the label under it (role / done state) */
  .card-slot{ display:flex; flex-direction:column; align-items:center; gap:6px; width:33.333%; }
  /* the card itself is the tap target; scoped so ordinary .btn children of a
     slot (e.g. "Redraw") keep their own box */
  .card-slot .slot-tap{ background:none; border:none; padding:0; display:flex;
    flex-direction:column; align-items:center; gap:6px; color:inherit; font-family:inherit; }
  /* two lines always reserved: "Habits and personality" wraps and the others
     don't, and without this the state line below sits lower in that column */
  .card-slot .slot-label{ font-size:12px; line-height:1.3; text-align:center; min-height:2.6em; }
  .card-slot .slot-state{ font-size:12px; }
  .card-row{ display:flex; gap:9px; align-items:flex-start; justify-content:center; }

  /* ---------- fields ---------- */
  .field{
    width:100%; background:#fff; color:#000; border:1px solid #000; border-radius:0;
    padding:12px; font-family:inherit; font-size:16px; line-height:1.55; resize:none;
    overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  }
  textarea.field{ flex:1; min-height:180px; }
  .field:focus{ outline:1px solid #000; }
  .name-field{ width:100%; max-width:300px; border:1px solid #000; border-radius:0; background:#fff;
    color:#000; font-family:inherit; font-size:18px; padding:12px; text-align:center; }

  /* ---------- persistent chrome ---------- */
  .chrome-bar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0;
    width:100%; max-width:var(--col);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 var(--gutter) calc(var(--safe-bottom) + 12px);
    z-index:40; pointer-events:none;
  }
  .chrome, .chrome-spacer{ width:var(--chrome-size); height:var(--chrome-size); flex:0 0 auto; }
  .chrome{ border:1px solid #000; background:#fff; color:#000; border-radius:0;
    display:flex; align-items:center; justify-content:center; font-size:16px; pointer-events:auto; }
  .chrome svg{ display:block; }

  /* ---------- journal / archive ---------- */
  .entry-head{ border:1px solid #000; padding:10px; margin-bottom:12px; }
  .entry-actions{ display:flex; justify-content:space-between; gap:10px; margin-top:12px; }
  .body-text{ white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word; }
  .archive-item{ display:block; width:100%; text-align:left; border:1px solid #000; background:#fff;
    color:#000; padding:14px; border-radius:0; margin-bottom:10px; font-family:inherit; font-size:16px; }
  .empty{ font-size:14.5px; }
  .divider{ border:none; border-top:1px solid #000; margin:16px 0; }
  .sketch-img{ width:100%; display:block; border:1px solid #000; }

  /* ---------- overlays ---------- */
  .overlay{ position:fixed; inset:0; background:#fff; z-index:60; display:flex; flex-direction:column;
    padding: calc(var(--safe-top) + 16px) var(--gutter) calc(var(--safe-bottom) + 16px); }
  .overlay.confirm{ align-items:center; justify-content:center; text-align:center; }
  .confirm-box{ border:1px solid #000; padding:24px; width:min(360px, 88vw);
    display:flex; flex-direction:column; align-items:center; gap:16px; }
  .close-x{ align-self:flex-end; background:#fff; border:1px solid #000; color:#000;
    width:36px; height:36px; line-height:1; border-radius:0; margin-bottom:10px; flex:0 0 auto; font-size:17px; }
  .help-body{ overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word; font-size:14.5px; line-height:1.65; }

  /* toast */
  .toast{ position:fixed; left:50%; transform:translateX(-50%);
    bottom: calc(var(--safe-bottom) + 64px); background:#fff; border:1px solid #000;
    padding:12px 16px; display:flex; align-items:center; gap:16px; z-index:45; font-size:14.5px; }
  .toast button{ background:none; border:none; color:#000; }

  /* ---------- sketch ---------- */
  .sketch-wrap{ flex:1; display:flex; flex-direction:column; gap:12px; min-height:0; }
  /* 16:9 pad — matches the canvas backing store, so pointer coordinates map
     without distortion and drawings sit wide in the journal rather than tall */
  .sketch-paper{ position:relative; width:100%; aspect-ratio:16/9; flex:0 0 auto; background:#fff;
    border:1px solid #000; overflow:hidden; touch-action:none; }
  .sketch-paper canvas{ position:absolute; inset:0; width:100%; height:100%; display:block;
    touch-action:none; cursor:crosshair; }
  .sketch-tools{ display:flex; justify-content:center; gap:10px; }
  .tool-btn{ border:1px solid #000; background:#fff; color:#000; border-radius:0; padding:10px 14px; font-size:13.5px; }
  .tool-btn.active{ background:#000; color:#fff; }
  .tool-btn:disabled{ opacity:.35; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + the compiled app are vendored locally (same-origin) so the app has
     no external runtime dependency: it loads instantly and works fully offline.
     app.js is compiled from app.src.jsx (the editable JSX source) with
     @babel/preset-react — edit app.src.jsx and recompile, not app.js. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script type="module" src="app.js"></script>

<script>
  // Register the service worker for offline / installable PWA support.
  // The shell is served cache-first, so a freshly shipped version normally
  // only appears on the SECOND launch. To apply updates on the FIRST launch:
  // when a new worker takes control shortly after load, reload once. The time
  // guard means we never reload mid-session (which could interrupt an entry
  // being written) — later updates just apply on the next launch.
  if ('serviceWorker' in navigator) {
    const loadedAt = Date.now();
    let hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController){ hadController = true; return; }   // first-ever install
      if (reloaded || Date.now() - loadedAt > 3000) return;
      reloaded = true;
      location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
