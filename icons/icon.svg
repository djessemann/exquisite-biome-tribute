<svg xmlns="http://www.w3.org/2000/svg" viewBox="35.9 31.1 140 140" width="200" height="200" role="img" aria-label="An amoeba">
  <!-- Line-drawn amoeba. Same kit as the app: black strokes on white, no fills,
       no color, no gradients.

       The membrane is a closed spline through r(a) = 1 + 0.20cos(3a+0.4)
       + 0.085cos(5a+1.7) + 0.055cos(2a-0.9) about (100,100) at radius 56 —
       three broad pseudopods, made unequal by the higher harmonics so it never
       reads as a flower.

       Interior features are placed with a clearance of at least 5 units from
       that curve and 4 from each other, and are deliberately of differing sizes
       and staggered heights: two similar circles level with one another read as
       a pair of eyes. -->
  <rect x="35.9" y="31.1" width="140" height="140" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- cell membrane -->
    <path stroke-width="4.2" d="M 165.36 76.14 C 169.48 80.88, 170.50 89.37, 169.32 95.53 C 168.13 101.69, 162.08 108.06, 158.25 113.10 C 154.43 118.14, 150.01 121.78, 146.37 125.74 C 142.72 129.70, 140.12 133.77, 136.37 136.88 C 132.61 139.98, 128.19 142.40, 123.83 144.38 C 119.48 146.36, 114.96 146.81, 110.25 148.76 C 105.54 150.71, 101.21 153.94, 95.59 156.08 C 89.98 158.21, 82.44 162.19, 76.54 161.57 C 70.65 160.95, 63.43 157.38, 60.22 152.37 C 57.01 147.37, 57.25 137.84, 57.27 131.52 C 57.28 125.21, 60.80 119.25, 60.32 114.48 C 59.84 109.72, 57.17 107.47, 54.38 102.94 C 51.59 98.41, 45.47 93.07, 43.59 87.31 C 41.71 81.56, 41.30 74.00, 43.09 68.41 C 44.89 62.81, 49.90 57.80, 54.38 53.73 C 58.85 49.67, 64.42 46.20, 69.94 44.03 C 75.47 41.85, 81.85 39.86, 87.53 40.68 C 93.21 41.50, 99.56 45.29, 104.01 48.94 C 108.47 52.59, 110.84 59.45, 114.26 62.58 C 117.68 65.71, 119.47 66.95, 124.53 67.70 C 129.59 68.46, 137.79 65.69, 144.60 67.10 C 151.40 68.51, 161.24 71.40, 165.36 76.14 Z"/>
    <!-- nucleus and nucleolus -->
    <circle cx="112" cy="87" r="16" stroke-width="3.4"/>
    <circle cx="112" cy="87" r="5.2" stroke-width="3"/>
    <!-- vacuoles -->
    <circle cx="79" cy="110" r="12" stroke-width="3.4"/>
    <circle cx="104" cy="126" r="6.5" stroke-width="3.2"/>
    <circle cx="129" cy="111" r="4" stroke-width="3"/>
    <circle cx="87" cy="80" r="4.5" stroke-width="3"/>
    <!-- granular cytoplasm -->
    <circle cx="68" cy="90" r="2.2" stroke-width="2.6"/>
    <circle cx="118" cy="123" r="2.2" stroke-width="2.6"/>
  </g>
</svg>
